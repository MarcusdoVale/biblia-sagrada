<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bíblia Sagrada</title>
<meta name="description" content="Bíblia para ler no celular, sem internet, com duas traduções livres para comparar.">
<meta name="theme-color" content="#5b3a1e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bíblia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f3;--bg2:#f3ede3;--card:#ffffff;--tx:#2b2420;--tx2:#6f645b;--linha:#e4dacb;
  --pri:#7a4a22;--pri2:#5b3a1e;--priTx:#fff;--add:#8a7f74;
  --h1:#fff1a8;--h2:#c9f0c4;--h3:#cfe3ff;--h4:#ffd4dc;
  --sombra:0 6px 24px rgba(60,40,20,.14);
  --ui:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --serif:'Literata',Georgia,'Times New Roman',serif;
}
:root[data-theme="sepia"]{--bg:#f4ecd8;--bg2:#ebe0c6;--card:#fbf5e6;--tx:#3a2e1f;--tx2:#7a6a52;--linha:#dccdab}
:root[data-theme="dark"]{
  --bg:#17130f;--bg2:#221c16;--card:#211b15;--tx:#ece3d6;--tx2:#a99a88;--linha:#3a3027;
  --pri:#d39b62;--pri2:#e7b47f;--priTx:#1a130c;--add:#8f8274;
  --h1:#5b5020;--h2:#284a2a;--h3:#22395a;--h4:#5a2a35;--sombra:0 6px 24px rgba(0,0,0,.5)
}
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --bg:#17130f;--bg2:#221c16;--card:#211b15;--tx:#ece3d6;--tx2:#a99a88;--linha:#3a3027;
  --pri:#d39b62;--pri2:#e7b47f;--priTx:#1a130c;--add:#8f8274;
  --h1:#5b5020;--h2:#284a2a;--h3:#22395a;--h4:#5a2a35;--sombra:0 6px 24px rgba(0,0,0,.5)
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--ui)}
body{min-height:100vh;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--linha);border-radius:10px;padding:10px 12px;width:100%}
.topo{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--linha);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:8px;align-items:center}
.ref{flex:1;min-width:0;text-align:left;font-weight:600;font-size:17px;padding:8px 10px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref small{font-weight:400;color:var(--tx2);font-size:13px;margin-left:4px}
.ref:active,.ib:active{background:var(--bg2)}
.trad{display:flex;background:var(--bg2);border-radius:10px;padding:3px}
.trad button{padding:6px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--tx2)}
.trad button.on{background:var(--card);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px}
main{max-width:720px;margin:0 auto;padding:0 16px}
.tela{display:none}.tela.on{display:block}
/* leitura */
.cap-tit{font-family:var(--serif);font-size:28px;font-weight:600;margin:22px 0 4px;text-align:center}
.cap-sub{text-align:center;color:var(--tx2);font-size:13px;margin-bottom:18px}
.texto{font-family:var(--serif);font-size:var(--fs,19px);line-height:1.75}
.v{border-radius:5px;padding:1px 2px;transition:background .15s}
.v sup{font-family:var(--ui);font-size:.58em;font-weight:600;color:var(--pri);margin-right:3px;vertical-align:.45em}
.v .add{font-style:italic;color:var(--add)}
.v.sel{outline:2px dashed var(--pri);outline-offset:1px}
.v.h1{background:var(--h1)}.v.h2{background:var(--h2)}.v.h3{background:var(--h3)}.v.h4{background:var(--h4)}
.v .nota-ic{font-size:.7em;margin-left:2px}
.cmp{display:block;margin:0 0 14px;padding:10px 12px;border-left:3px solid var(--linha);border-radius:0 8px 8px 0}
.cmp .lin{display:block;margin-top:2px}
.cmp .lin b{font-family:var(--ui);font-size:11px;letter-spacing:.04em;color:var(--tx2);font-weight:600;margin-right:6px}
.paragrafo .v{display:inline}
.aviso{background:var(--bg2);border-radius:12px;padding:14px 16px;margin:18px 0;font-size:15px;line-height:1.5}
.aviso button{margin-top:10px}
.nav-cap{display:flex;gap:10px;margin:28px 0 20px}
.nav-cap button{flex:1;padding:14px;border-radius:12px;background:var(--bg2);font-weight:600;color:var(--pri)}
.nav-cap button:disabled{opacity:.35}
.btn{padding:11px 16px;border-radius:10px;background:var(--pri);color:var(--priTx);font-weight:600}
.btn2{padding:11px 16px;border-radius:10px;background:var(--bg2);color:var(--pri);font-weight:600}
/* livros */
.abas{display:flex;gap:6px;overflow-x:auto;padding:14px 0 10px;scrollbar-width:none}
.abas button{white-space:nowrap;padding:8px 14px;border-radius:999px;background:var(--bg2);font-size:14px;font-weight:500;color:var(--tx2)}
.abas button.on{background:var(--pri);color:var(--priTx)}
.grupo-tit{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);margin:16px 2px 8px;font-weight:600}
.lista-livros{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.lista-livros button{text-align:left;padding:12px;border-radius:10px;background:var(--card);border:1px solid var(--linha);font-size:15px}
.lista-livros button small{display:block;color:var(--tx2);font-size:12px;margin-top:2px}
.lista-livros button.atual{border-color:var(--pri);color:var(--pri);font-weight:600}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px;margin:10px 0 24px}
.caps button{aspect-ratio:1;border-radius:10px;background:var(--card);border:1px solid var(--linha);font-weight:500}
.caps button.atual{background:var(--pri);color:var(--priTx);border-color:var(--pri)}
.voltar{display:inline-flex;gap:6px;align-items:center;color:var(--pri);font-weight:600;padding:14px 0 4px}
/* busca e listas */
.busca-bar{display:flex;gap:8px;margin:16px 0 8px}
.res{padding:12px 2px;border-bottom:1px solid var(--linha)}
.res .r{font-size:13px;font-weight:600;color:var(--pri);margin-bottom:3px}
.res .t{font-family:var(--serif);font-size:16px;line-height:1.55}
.res mark{background:var(--h1);color:inherit;border-radius:3px}
.res .n{font-size:14px;color:var(--tx2);margin-top:6px;white-space:pre-wrap;background:var(--bg2);padding:8px 10px;border-radius:8px}
.vazio{color:var(--tx2);text-align:center;padding:40px 10px;line-height:1.6}
.info{color:var(--tx2);font-size:13px;margin:6px 2px}
/* sobre */
.doc{line-height:1.65;font-size:16px;padding-bottom:30px}
.doc h2{font-family:var(--serif);font-size:24px;margin:26px 0 8px}
.doc h3{font-size:16px;margin:22px 0 6px;color:var(--pri)}
.doc .caixa{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;margin:10px 0}
.doc .caixa p{margin:4px 0}
.doc small{color:var(--tx2)}
.cfg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--linha)}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{padding:7px 11px;border-radius:8px;font-size:14px;color:var(--tx2)}
.seg button.on{background:var(--card);color:var(--pri);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
/* barra inferior */
.barra{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--linha);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.barra button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--tx2)}
.barra button span{font-size:20px;line-height:1.1}
.barra button.on{color:var(--pri);font-weight:600}
/* folha do versículo */
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:40;display:none}
.fundo.on{display:block}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:18px 18px 0 0;box-shadow:var(--sombra);padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s ease;max-width:720px;margin:0 auto;max-height:85vh;overflow:auto}
.folha.on{transform:none}
.alca{width:40px;height:4px;border-radius:4px;background:var(--linha);margin:0 auto 10px}
.folha .fr{font-weight:600;color:var(--pri);margin-bottom:4px}
.folha .ft{font-family:var(--serif);font-size:16px;line-height:1.55;margin-bottom:12px;max-height:30vh;overflow:auto}
.cores{display:flex;gap:10px;margin:6px 0 14px;align-items:center}
.cores button{width:36px;height:36px;border-radius:50%;border:2px solid var(--linha)}
.cores button.on{border-color:var(--pri);border-width:3px}
.acoes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.acoes button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px;border-radius:12px;background:var(--bg2);font-size:12px}
.acoes button span{font-size:20px}
.folha textarea{min-height:110px;margin:8px 0}
.vt .g1{background:var(--h1);border-radius:3px}.vt .g2{background:var(--h2);border-radius:3px}.vt .g3{background:var(--h3);border-radius:3px}.vt .g4{background:var(--h4);border-radius:3px}
.grifo-bar{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:35;background:var(--card);border:1px solid var(--linha);box-shadow:var(--sombra);border-radius:999px;padding:6px 10px;display:none;align-items:center;gap:8px;font-size:13px;color:var(--tx2);white-space:nowrap}
.grifo-bar.on{display:flex}
.grifo-bar button{width:32px;height:32px;border-radius:50%;border:2px solid var(--linha);font-size:14px}
.resumo{margin:14px 0 4px}
.resumo .r{font-size:13px;font-weight:600;color:var(--pri);margin:0 2px 6px;display:flex;justify-content:space-between}
.resumo .r small{font-weight:400;color:var(--tx2)}
.resumo textarea{min-height:90px;resize:none;font-family:var(--serif);font-size:16px;line-height:1.55;overflow:hidden}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.carregando{text-align:center;color:var(--tx2);padding:60px 0}
/* devocional */
.dev-data{text-align:center;color:var(--tx2);font-size:13px;margin-top:20px;text-transform:capitalize}
.dev-tema{font-family:var(--serif);font-size:26px;font-weight:600;text-align:center;margin:6px 0 18px;line-height:1.3}
.dev-p{background:var(--card);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.dev-p .r{font-size:13px;font-weight:600;color:var(--pri);margin-bottom:4px;display:flex;justify-content:space-between;gap:8px}
.dev-p .r span{font-weight:500;color:var(--tx2)}
.dev-p .t{font-family:var(--serif);font-size:calc(var(--fs,19px) - 2px);line-height:1.65}
.dev-p .t sup{font-family:var(--ui);font-size:.6em;font-weight:600;color:var(--pri);margin-right:2px;vertical-align:.45em}
.dev-p .t .add{font-style:italic;color:var(--add)}
.ir-cap{display:inline-block;font-family:var(--ui);font-size:12px;font-weight:600;color:var(--pri);background:var(--bg2);border-radius:999px;padding:3px 10px;margin-left:4px;vertical-align:2px;white-space:nowrap}
.temas button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--linha);font-size:15px}
.temas button small{color:var(--tx2)}
</style>
</head>
<body>
<header class="topo">
  <button class="ref" id="btRef" onclick="irPara('livros')">…</button>
  <div class="trad" id="trad">
    <button data-t="blivre">BL</button><button data-t="bpm">BPM</button><button data-t="cmp">Comparar</button>
  </div>
</header>

<main>
  <section class="tela on" id="t-ler"><div class="carregando">Abrindo a Bíblia…</div></section>
  <section class="tela" id="t-livros"></section>
  <section class="tela" id="t-busca">
    <div class="busca-bar">
      <input id="q" type="search" placeholder="Buscar palavra ou frase (ex.: amor ao próximo)" enterkeyhint="search">
      <button class="btn" onclick="buscar()">Buscar</button>
    </div>
    <div class="seg" id="buscaTrad" style="display:inline-flex"><button data-t="blivre">Bíblia Livre</button><button data-t="bpm">Portuguesa Mundial</button></div>
    <div id="resBusca"></div>
  </section>
  <section class="tela" id="t-meus"></section>
  <section class="tela" id="t-sobre"></section>
  <section class="tela" id="t-hoje"></section>
</main>

<nav class="barra" id="barra">
  <button data-t="hoje"><span>🌅</span>Hoje</button>
  <button data-t="ler" class="on"><span>📖</span>Ler</button>
  <button data-t="livros"><span>📚</span>Livros</button>
  <button data-t="busca"><span>🔍</span>Buscar</button>
  <button data-t="meus"><span>⭐</span>Estudos</button>
  <button data-t="sobre"><span>ℹ️</span>Sobre</button>
</nav>

<div class="fundo" id="fundo" onclick="fecharFolha()"></div>
<div class="folha" id="folha"></div>
<div class="toast" id="toast"></div>
<div class="grifo-bar" id="grifoBar"><span>Grifar</span>
  <button data-g="h1" style="background:var(--h1)"></button><button data-g="h2" style="background:var(--h2)"></button><button data-g="h3" style="background:var(--h3)"></button><button data-g="h4" style="background:var(--h4)"></button>
  <button data-g="" title="Apagar grifo">✕</button></div>

<script>
// ---------- livros ----------
// [código, nome, abreviação, grupo, página do interlinear (biblehub)]
const LIVROS = [
 ['GEN','Gênesis','Gn','at','genesis'],['EXO','Êxodo','Êx','at','exodus'],['LEV','Levítico','Lv','at','leviticus'],['NUM','Números','Nm','at','numbers'],['DEU','Deuteronômio','Dt','at','deuteronomy'],
 ['JOS','Josué','Js','at','joshua'],['JDG','Juízes','Jz','at','judges'],['RUT','Rute','Rt','at','ruth'],['1SA','1 Samuel','1Sm','at','1_samuel'],['2SA','2 Samuel','2Sm','at','2_samuel'],
 ['1KI','1 Reis','1Rs','at','1_kings'],['2KI','2 Reis','2Rs','at','2_kings'],['1CH','1 Crônicas','1Cr','at','1_chronicles'],['2CH','2 Crônicas','2Cr','at','2_chronicles'],['EZR','Esdras','Ed','at','ezra'],
 ['NEH','Neemias','Ne','at','nehemiah'],['EST','Ester','Et','at','esther'],['JOB','Jó','Jó','at','job'],['PSA','Salmos','Sl','at','psalms'],['PRO','Provérbios','Pv','at','proverbs'],
 ['ECC','Eclesiastes','Ec','at','ecclesiastes'],['SOL','Cântico dos Cânticos','Ct','at','songs'],['ISA','Isaías','Is','at','isaiah'],['JER','Jeremias','Jr','at','jeremiah'],['LAM','Lamentações','Lm','at','lamentations'],
 ['EZE','Ezequiel','Ez','at','ezekiel'],['DAN','Daniel','Dn','at','daniel'],['HOS','Oseias','Os','at','hosea'],['JOE','Joel','Jl','at','joel'],['AMO','Amós','Am','at','amos'],
 ['OBA','Obadias','Ob','at','obadiah'],['JON','Jonas','Jn','at','jonah'],['MIC','Miqueias','Mq','at','micah'],['NAH','Naum','Na','at','nahum'],['HAB','Habacuque','Hc','at','habakkuk'],
 ['ZEP','Sofonias','Sf','at','zephaniah'],['HAG','Ageu','Ag','at','haggai'],['ZEC','Zacarias','Zc','at','zechariah'],['MAL','Malaquias','Ml','at','malachi'],
 ['MAT','Mateus','Mt','nt','matthew'],['MAR','Marcos','Mc','nt','mark'],['LUK','Lucas','Lc','nt','luke'],['JOH','João','Jo','nt','john'],['ACT','Atos','At','nt','acts'],
 ['ROM','Romanos','Rm','nt','romans'],['1CO','1 Coríntios','1Co','nt','1_corinthians'],['2CO','2 Coríntios','2Co','nt','2_corinthians'],['GAL','Gálatas','Gl','nt','galatians'],['EPH','Efésios','Ef','nt','ephesians'],
 ['PHI','Filipenses','Fp','nt','philippians'],['COL','Colossenses','Cl','nt','colossians'],['1TH','1 Tessalonicenses','1Ts','nt','1_thessalonians'],['2TH','2 Tessalonicenses','2Ts','nt','2_thessalonians'],['1TI','1 Timóteo','1Tm','nt','1_timothy'],
 ['2TI','2 Timóteo','2Tm','nt','2_timothy'],['TIT','Tito','Tt','nt','titus'],['PHM','Filemom','Fm','nt','philemon'],['HEB','Hebreus','Hb','nt','hebrews'],['JAM','Tiago','Tg','nt','james'],
 ['1PE','1 Pedro','1Pe','nt','1_peter'],['2PE','2 Pedro','2Pe','nt','2_peter'],['1JO','1 João','1Jo','nt','1_john'],['2JO','2 João','2Jo','nt','2_john'],['3JO','3 João','3Jo','nt','3_john'],
 ['JUD','Judas','Jd','nt','jude'],['REV','Apocalipse','Ap','nt','revelation'],
];
const LIV = Object.fromEntries(LIVROS.map((l, i) => [l[0], {cod: l[0], nome: l[1], abr: l[2], grupo: l[3], hub: l[4], i}]));
const GRUPOS = {at: 'Antigo Testamento', nt: 'Novo Testamento'};
const TRAD = {
  blivre: {sigla: 'BL', nome: 'Bíblia Livre'},
  bpm: {sigla: 'BPM', nome: 'Bíblia Portuguesa Mundial'},
};

// ---------- estado (fica só neste aparelho) ----------
const CHAVE = 'biblia_v1';
let E = {livro: 'JOH', cap: 1, trad: 'blivre', modo: 'blivre', tema: '', fs: 19, buscaTrad: 'blivre', marcas: {}};
try { Object.assign(E, JSON.parse(localStorage.getItem(CHAVE) || '{}')); } catch (e) {}
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(E)); } catch (e) {} }
// marcas: { "JOH.3.16": {cor:'h1', fav:true, nota:'...', em:Date.now()} }

const DADOS = {};
function carregar(t) {
  if (!DADOS[t]) DADOS[t] = fetch('dados/' + t + '.json').then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => j.livros).catch(e => { delete DADOS[t]; throw e; });
  return DADOS[t];
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
// [palavras entre colchetes] = palavras que o tradutor acrescentou para o português fazer sentido
const fmt = s => esc(s).replace(/\[([^\]]*)\]/g, '<span class="add">$1</span>');
// versículo com os grifos feitos com o dedo; posições contadas no texto já sem os [colchetes]
// E.grifos["blivre|JOH.3.16"] = [[início, fim, 'h1'], ...] — cada tradução tem os seus (o texto é diferente)
function fmtG(raw, t, k) {
  const gs = (E.grifos || {})[t + '|' + k] || [], ch = [], add = [];
  let dentro = false;
  for (let x = 0; x < raw.length; x++) { const c = raw[x]; if (c === '[') { dentro = true; continue; } if (c === ']') { dentro = false; continue; } ch.push(c); add.push(dentro); }
  const cor = new Array(ch.length).fill('');
  for (const [a, b, c] of gs) for (let x = a; x < b && x < ch.length; x++) cor[x] = c;
  let out = '';
  for (let i = 0, j; i < ch.length; i = j) {
    for (j = i; j < ch.length && add[j] === add[i] && cor[j] === cor[i]; j++);
    const cls = [add[i] ? 'add' : '', cor[i] ? 'g' + cor[i].slice(1) : ''].filter(Boolean).join(' '), tx = esc(ch.slice(i, j).join(''));
    out += cls ? `<span class="${cls}">${tx}</span>` : tx;
  }
  return `<span class="vt" data-t="${t}" data-k="${k}">${out}</span>`;
}
const semAcento = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 1800); }

// ---------- leitura ----------
async function ler(opt = {}) {
  marcarSeg('#trad', E.modo);
  const L = LIV[E.livro];
  $('#btRef').innerHTML = esc(L.nome + ' ' + E.cap) + ' <small>▾</small>';
  const el = $('#t-ler');
  const trads = E.modo === 'cmp' ? ['blivre', 'bpm'] : [E.modo];
  let textos;
  try { textos = await Promise.all(trads.map(carregar)); }
  catch (e) { el.innerHTML = '<div class="aviso">Não consegui abrir o texto. Na primeira vez o app precisa de internet para baixar a Bíblia; depois funciona sem internet.<br><button class="btn" onclick="ler()">Tentar de novo</button></div>'; return; }
  const caps = textos.map(t => (t[E.livro] || []));
  const nCaps = Math.max(...caps.map(c => c.length));
  if (E.cap > nCaps) E.cap = Math.max(nCaps, 1);
  let h = `<div class="cap-tit">${esc(L.nome)} ${E.cap}</div><div class="cap-sub">${trads.map(t => TRAD[t].nome).join(' × ')}</div>`;
  if (E.modo === 'cmp') {
    const n = Math.max(...caps.map(c => (c[E.cap - 1] || []).length));
    h += '<div class="texto">';
    for (let v = 1; v <= n; v++) {
      const linhas = trads.map((t, i) => { const tx = (caps[i][E.cap - 1] || [])[v - 1]; return tx ? `<span class="lin"><b>${TRAD[t].sigla}</b>${fmtG(tx, t, E.livro + '.' + E.cap + '.' + v)}</span>` : ''; }).join('');
      if (!linhas) continue;
      const m = E.marcas[E.livro + '.' + E.cap + '.' + v] || {};
      h += `<span class="v cmp ${m.cor || ''}" data-v="${v}"><sup>${v}</sup>${m.nota ? '<span class="nota-ic">📝</span>' : ''}${m.fav ? '<span class="nota-ic">⭐</span>' : ''}${linhas}</span>`;
    }
    h += '</div>';
  } else if (caps[0].length) {
    const vs = caps[0][E.cap - 1] || [];
    h += '<div class="texto paragrafo">';
    vs.forEach((tx, i) => {
      if (!tx) return;
      const v = i + 1, m = E.marcas[E.livro + '.' + E.cap + '.' + v] || {};
      h += `<span class="v ${m.cor || ''}" data-v="${v}"><sup>${v}</sup>${fmtG(tx, E.modo, E.livro + '.' + E.cap + '.' + v)}${m.nota ? '<span class="nota-ic">📝</span>' : ''}${m.fav ? '<span class="nota-ic">⭐</span>' : ''}</span> `;
    });
    h += '</div>';
  }
  const [ant, prox] = vizinhos();
  h += `<div class="nav-cap"><button ${ant ? '' : 'disabled'} onclick="mudar(-1)">‹ ${ant ? esc(LIV[ant[0]].abr + ' ' + ant[1]) : ''}</button><button ${prox ? '' : 'disabled'} onclick="mudar(1)">${prox ? esc(LIV[prox[0]].abr + ' ' + prox[1]) : ''} ›</button></div>`;
  el.innerHTML = h;
  if (opt.ver) {
    const alvo = el.querySelector(`.v[data-v="${opt.ver}"]`);
    if (alvo) { alvo.classList.add('sel'); setTimeout(() => alvo.scrollIntoView({block: 'center'}), 30); setTimeout(() => alvo.classList.remove('sel'), 2500); }
  } else if (!opt.manterScroll) scrollTo(0, 0);
  salvar();
}
function capsDe(liv) {
  const t = E.modo === 'cmp' ? ['blivre', 'bpm'] : [E.modo];
  return Math.max(0, ...t.map(x => (CAPS[x] && CAPS[x][liv]) || 0));
}
const CAPS = {};
async function contarCaps(t) { const d = await carregar(t); CAPS[t] = Object.fromEntries(Object.entries(d).map(([k, v]) => [k, v.length])); }
function vizinhos() {
  const seq = LIVROS.filter(l => capsDe(l[0]) > 0).map(l => l[0]);
  const i = seq.indexOf(E.livro), n = capsDe(E.livro);
  const ant = E.cap > 1 ? [E.livro, E.cap - 1] : (i > 0 ? [seq[i - 1], capsDe(seq[i - 1])] : null);
  const prox = E.cap < n ? [E.livro, E.cap + 1] : (i >= 0 && i < seq.length - 1 ? [seq[i + 1], 1] : null);
  return [ant, prox];
}
function mudar(d) { const [a, p] = vizinhos(); const x = d < 0 ? a : p; if (!x) return; E.livro = x[0]; E.cap = x[1]; ler(); }
function abrir(liv, cap, ver) { E.livro = liv; E.cap = cap; irPara('ler'); ler({ver}); }

  $('#fundo').classList.add('on'); $('#folha').classList.add('on');
}

function marca(criar) { const k = selV.liv + '.' + selV.cap + '.' + selV.ver; if (!E.marcas[k] && criar) E.marcas[k] = {}; return [k, E.marcas[k]]; }
function limparMarca(k) { const m = E.marcas[k]; if (m && !m.cor && !m.fav && !m.nota) delete E.marcas[k]; }
function depoisMarca(k) { if (E.marcas[k]) E.marcas[k].em = Date.now(); limparMarca(k); salvar(); if (telaAtual === 'hoje') { const y = scrollY; telaHoje().then(() => scrollTo(0, y)); } else if (selV.liv === E.livro && selV.cap === E.cap) ler({manterScroll: true}); }
function pintar(c) { const [k, m] = marca(true); m.cor = c; depoisMarca(k); fecharFolha(); }
function favoritar() { const [k, m] = marca(true); m.fav = !m.fav; depoisMarca(k); toast(m.fav ? 'Guardado nos favoritos' : 'Tirado dos favoritos'); fecharFolha(); }

  setTimeout(() => $('#notaTx').focus(), 50);
}
function salvarNota() { const [k, m] = marca(true); m.nota = $('#notaTx').value.trim(); depoisMarca(k); toast('Nota salva'); fecharFolha(); }
async function compararVers() {

async function textoParaCopiar() { const t = E.modo === 'cmp' ? 'blivre' : E.modo; const tx = (await textoVers(t, selV.liv, selV.cap, selV.ver)).replace(/[\[\]]/g, ''); return `"${tx}" — ${refTxt(selV.liv, selV.cap, selV.ver)} (${TRAD[t].sigla})`; }
async function copiar() { const s = await textoParaCopiar(); try { await navigator.clipboard.writeText(s); toast('Copiado'); } catch (e) { prompt('Copie o texto:', s); } fecharFolha(); }
async function compartilhar() { const s = await textoParaCopiar(); if (navigator.share) { try { await navigator.share({text: s}); } catch (e) {} } else { copiar(); } fecharFolha(); }

// ---------- grifar palavras selecionadas ----------
let grifoRange = null, grifoT = null;
document.addEventListener('selectionchange', () => {
  clearTimeout(grifoT);
  grifoT = setTimeout(() => {
    const sel = getSelection();
    const r = sel.rangeCount && !sel.isCollapsed ? sel.getRangeAt(0) : null;
    const ok = r && [...document.querySelectorAll('.tela.on .vt')].some(vt => r.intersectsNode(vt));
    if (ok) { grifoRange = r.cloneRange(); $('#grifoBar').classList.add('on'); }
    else { grifoRange = null; $('#grifoBar').classList.remove('on'); }
  }, 120);
});
$('#grifoBar').addEventListener('pointerdown', e => e.preventDefault()); // não perde a seleção ao tocar na barra
$('#grifoBar').addEventListener('mousedown', e => e.preventDefault());
$('#grifoBar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) grifar(b.dataset.g); });
function grifar(cor) {
  const r = grifoRange; if (!r) return;
  E.grifos = E.grifos || {};
  for (const vt of document.querySelectorAll('.tela.on .vt')) {
    if (!r.intersectsNode(vt)) continue;
    const pos = (node, off) => { const x = document.createRange(); x.setStart(vt, 0); x.setEnd(node, off); return x.toString().length; };
    let a = vt.contains(r.startContainer) ? pos(r.startContainer, r.startOffset) : 0;
    let b = vt.contains(r.endContainer) ? pos(r.endContainer, r.endOffset) : vt.textContent.length;
    const tx = vt.textContent;
    while (a < b && tx[a] === ' ') a++; while (b > a && tx[b - 1] === ' ') b--; // sem espaços nas pontas
    if (b <= a) continue;
    const k = vt.dataset.t + '|' + vt.dataset.k;
    const lista = (E.grifos[k] || []).flatMap(([x, y, c]) => [...(x < a ? [[x, Math.min(y, a), c]] : []), ...(y > b ? [[Math.max(x, b), y, c]] : [])]);
    if (cor) lista.push([a, b, cor]);
    lista.sort((p, q) => p[0] - q[0]);
    if (lista.length) E.grifos[k] = lista; else delete E.grifos[k];
  }
  salvar();
  getSelection().removeAllRanges(); grifoRange = null; $('#grifoBar').classList.remove('on');
  redesenhar();
  if (cor) toast('Grifado');
}
function redesenhar() {
  const y = scrollY, volta = () => scrollTo(0, y);
  if (telaAtual === 'hoje') telaHoje().then(volta); else if (telaAtual === 'meus') telaMeus().then(volta); else if (telaAtual === 'ler') ler({manterScroll: true});
}

// ---------- busca ----------
$('#buscaTrad').onclick = e => { const b = e.target.closest('button'); if (!b) return; E.buscaTrad = b.dataset.t; salvar(); marcarSeg('#buscaTrad', E.buscaTrad); if ($('#q').value.trim()) buscar(); };
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') buscar(); });
async function buscar() {
  const q = $('#q').value.trim(), el = $('#resBusca');
  if (q.length < 2) { el.innerHTML = '<div class="vazio">Digite pelo menos 2 letras.</div>'; return; }
  // atalho: "Jo 3:16", "joão 3 16", "salmos 23"
  const r = q.match(/^(.+?)\s*(\d+)(?:\s*[:.,\s]\s*(\d+))?$/);
  if (r) {
    const bruto = r[1].replace(/\s+/g, ' ').trim().toLowerCase(), nome = semAcento(bruto);
    // primeiro com acento ("jo" = João, "jó" = Jó), depois sem acento
    const L = LIVROS.find(l => l[1].toLowerCase() === bruto || l[2].toLowerCase() === bruto.replace(/\s/g, '')) ||
      LIVROS.find(l => semAcento(l[1]) === nome || semAcento(l[2]) === nome.replace(/\s/g, '')) || LIVROS.find(l => semAcento(l[1]).startsWith(nome));
    if (L && nome.length >= 2) { abrir(L[0], +r[2], r[3] ? +r[3] : undefined); return; }
  }
  el.innerHTML = '<div class="vazio">Procurando…</div>';
  const d = await carregar(E.buscaTrad);
  const termos = semAcento(q).split(/\s+/).filter(Boolean);
  const achados = [];
  for (const l of LIVROS) {
    const caps = d[l[0]]; if (!caps) continue;
    caps.forEach((vs, c) => vs.forEach((tx, v) => { if (!tx) return; const s = semAcento(tx); if (termos.every(t => s.includes(t))) achados.push([l[0], c + 1, v + 1, tx]); }));
  }
  if (!achados.length) { el.innerHTML = `<div class="vazio">Nada encontrado para “${esc(q)}”.<br>Tente outra palavra ou a outra tradução.</div>`; return; }
  const LIM = 300;
  const rx = new RegExp('(' + termos.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
  el.innerHTML = `<div class="info">${achados.length} versículo${achados.length > 1 ? 's' : ''}${achados.length > LIM ? ' — mostrando os ' + LIM + ' primeiros' : ''}</div>` +
    achados.slice(0, LIM).map(([l, c, v, tx]) => `<div class="res" onclick="abrirBusca('${l}',${c},${v})"><div class="r">${esc(refTxt(l, c, v))}</div><div class="t">${destacar(tx, rx)}</div></div>`).join('');
}
function destacar(tx, rx) {
  // destaca sem depender de acento: compara a versão sem acento, letra a letra
  const limpo = tx.replace(/[\[\]]/g, ''), s = semAcento(limpo);
  let out = '', i = 0, m; rx.lastIndex = 0;
  while ((m = rx.exec(s))) { out += esc(limpo.slice(i, m.index)) + '<mark>' + esc(limpo.slice(m.index, m.index + m[0].length)) + '</mark>'; i = m.index + m[0].length; if (!m[0].length) rx.lastIndex++; }
  return out + esc(limpo.slice(i));
}
function abrirBusca(l, c, v) { if (E.modo !== 'cmp') E.modo = E.trad = E.buscaTrad; abrir(l, c, v); }

// ---------- meus estudos ----------
let filtroMeus = 'tudo';
async function telaMeus() {
  const el = $('#t-meus');
  const porVers = {};
  for (const [k, m] of Object.entries(E.marcas)) porVers[k] = {k, m, gt: null};
  for (const gk of Object.keys(E.grifos || {})) { const [t, k] = gk.split('|'); porVers[k] = porVers[k] || {k, m: {}, gt: null}; porVers[k].gt = porVers[k].gt || t; }
  const itens = Object.values(porVers).map(x => { const [l, c, v] = x.k.split('.'); return {...x, l, c: +c, v: +v}; })
    .filter(x => LIV[x.l])
    .filter(x => filtroMeus === 'tudo' || (filtroMeus === 'fav' && x.m.fav) || (filtroMeus === 'nota' && x.m.nota) || (filtroMeus === 'cor' && (x.m.cor || x.gt)))
    .sort((a, b) => (LIV[a.l]?.i - LIV[b.l]?.i) || a.c - b.c || a.v - b.v);
  let h = '<div class="abas">' + [['tudo', 'Tudo'], ['res', '✍️ Resumos'], ['fav', '⭐ Favoritos'], ['nota', '📝 Notas'], ['cor', '🖍 Destaques']].map(([f, n]) => `<button class="${f === filtroMeus ? 'on' : ''}" onclick="filtroMeus='${f}';telaMeus()">${n}</button>`).join('') + '</div>';
  const resumos = Object.entries(E.resumos || {}).filter(([, r]) => r && r.tx);
  const verRes = filtroMeus === 'tudo' || filtroMeus === 'res';
  const dev = verRes && resumos.length ? await carregarDev().catch(() => []) : [];
  if (verRes) resumos.sort((a, b) => b[1].em - a[1].em).forEach(([i, r]) => {
    if (!dev[i]) return;
    h += `<div class="res" onclick="devUnico=${i};irPara('hoje')"><div class="r">✍️ ${esc(dev[i].tema)} <span style="font-weight:400;color:var(--tx2)">· ${new Date(r.em).toLocaleDateString('pt-BR')}</span></div><div class="n" style="margin-top:2px">${esc(r.tx)}</div></div>`;
  });
  if (filtroMeus === 'res') itens.length = 0;
  if (!itens.length && !(verRes && resumos.length)) h += '<div class="vazio">Nada aqui ainda.<br>Enquanto lê, <b>toque num versículo</b> para destacar, favoritar ou anotar, ou <b>segure o dedo e selecione palavras</b> para grifar.<br>No devocional, escreva em <b>✍️ Meu resumo</b>.</div>';
  for (const x of itens) {
    const t = x.gt || E.trad, d = await carregar(t).catch(() => ({}));
    const tx = ((d[x.l] || [])[x.c - 1] || [])[x.v - 1] || '';
    h += `<div class="res" onclick="if(!getSelection().toString())abrir('${x.l}',${x.c},${x.v})"><div class="r">${x.m.fav ? '⭐ ' : ''}${x.m.cor ? `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--${x.m.cor});margin-right:4px"></span>` : ''}${esc(refTxt(x.l, x.c, x.v))}${x.gt ? ` <span style="font-weight:400;color:var(--tx2)">(${TRAD[t].sigla})</span>` : ''}</div><div class="t">${fmtG(tx, t, x.k)}</div>${x.m.nota ? `<div class="n">${esc(x.m.nota)}</div>` : ''}</div>`;
  }
  h += `<div class="aviso" style="margin-top:26px"><b>Cópia de segurança</b><br>Seus destaques, grifos, notas e resumos ficam guardados só neste celular. Se trocar de aparelho ou limpar o navegador, eles se perdem — de vez em quando, salve uma cópia.<br>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="exportar()">Salvar cópia</button><button class="btn2" onclick="$('#arqImp').click()">Restaurar cópia</button></div>
    <input type="file" id="arqImp" accept=".json,application/json" style="display:none" onchange="importar(this.files[0])"></div><div style="height:20px"></div>`;
  el.innerHTML = h;
}
function exportar() {
  const blob = new Blob([JSON.stringify({app: 'biblia', versao: 2, data: new Date().toISOString(), marcas: E.marcas, grifos: E.grifos || {}, resumos: E.resumos || {}, devLidos: E.devLidos || {}}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'meus-estudos-biblia-' + new Date().toISOString().slice(0, 10) + '.json'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function importar(f) {
  if (!f) return;
  f.text().then(s => { const j = JSON.parse(s); if (!j.marcas) throw 0; let n = 0; for (const [k, m] of Object.entries(j.marcas)) { const atual = E.marcas[k]; if (!atual || (m.em || 0) > (atual.em || 0)) { E.marcas[k] = m; n++; } }
    E.grifos = E.grifos || {}; for (const [k, g] of Object.entries(j.grifos || {})) if (!E.grifos[k]) { E.grifos[k] = g; n++; }
    E.resumos = E.resumos || {}; for (const [k, r] of Object.entries(j.resumos || {})) { const a = E.resumos[k]; if (!a || (r.em || 0) > (a.em || 0)) { E.resumos[k] = r; n++; } }
    E.devLidos = Object.assign({}, j.devLidos || {}, E.devLidos || {}); salvar(); toast(n + ' marcações restauradas'); telaMeus(); })
    .catch(() => toast('Arquivo inválido'));
}

// ---------- devocional: um tema por dia, só com textos bíblicos ----------
let DEV = null, devOff = 0, devUnico = null, devTemas = false; // devOff = dias antes/depois de hoje
const INICIO_DEV = new Date(2026, 9, 23); // os temas começam neste dia; seguem em ordem e recomeçam
const hojeZero = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
function carregarDev() { if (!DEV) DEV = fetch('dados/devocional.json').then(r => r.json()).catch(e => { DEV = null; throw e; }); return DEV; }
function partesRef(ref) {
  const [, liv, cap, vs] = ref.match(/^(\w{3}) (\d+):([\d,\-]+)$/);
  const lista = []; vs.split(',').forEach(p => { const [a, b] = p.split('-').map(Number); for (let v = a; v <= (b || a); v++) lista.push(v); });
  return {liv, cap: +cap, vs: lista};
}
function nomeRef(ref) { const {liv, cap} = partesRef(ref); return LIV[liv].nome + ' ' + cap + ':' + ref.split(':')[1].replace(/,/g, ', '); }
function blocoTema(d, i, txt, rotulo) {
  let h = `${rotulo ? `<div class="grupo-tit" style="text-align:center;margin-top:26px">${rotulo}</div>` : ''}<div class="dev-tema">${esc(d.tema)}</div>`;
  for (const ref of d.refs) {
    const {liv, cap, vs} = partesRef(ref), caps = (txt[liv] || [])[cap - 1] || [];
    // tocar no versículo = marcar (cor, favorito, nota); o número no fim abre o capítulo
    h += `<div class="dev-p"><div class="r">${esc(nomeRef(ref))}</div><div class="t">` +
      vs.map(v => { if (!caps[v - 1]) return ''; const m = E.marcas[liv + '.' + cap + '.' + v] || {};
        return `<span class="v dv ${m.cor || ''}" data-l="${liv}" data-c="${cap}" data-v="${v}">${vs.length > 1 ? `<sup>${v}</sup>` : ''}${fmtG(caps[v - 1], E.trad, liv + '.' + cap + '.' + v)}${m.nota ? '<span class="nota-ic">📝</span>' : ''}${m.fav ? '<span class="nota-ic">⭐</span>' : ''}</span>`; }).join(' ') +
      ` <button class="ir-cap" onclick="abrir('${liv}',${cap},${vs[0]})" title="Ler o capítulo inteiro">${LIV[liv].abr} ${cap}:${vs[0]} ›</button></div></div>`;
  }
  const lido = (E.devLidos || {})[i], res = (E.resumos || {})[i];
  h += `<div class="resumo"><div class="r">✍️ Meu resumo<small id="rs${i}">${res && res.tx ? 'salvo' : ''}</small></div><textarea data-i="${i}" placeholder="Escreva com suas palavras o que você aprendeu e como vai usar isso na sua vida…">${esc((res && res.tx) || '')}</textarea></div>`;
  return h + `<div style="text-align:center;margin:14px 0 6px"><button class="${lido ? 'btn2' : 'btn'}" onclick="marcarDev(${i})">${lido ? '✓ Lido' : 'Marcar como lido'}</button></div>`;
}
async function telaHoje() {
  const el = $('#t-hoje');
  let dev; try { dev = await carregarDev(); } catch (e) { el.innerHTML = '<div class="aviso">Não consegui abrir o devocional. <button class="btn" onclick="telaHoje()">Tentar de novo</button></div>'; return; }
  const n = dev.length, txt = await carregar(E.trad);
  if (devTemas) {
    el.innerHTML = `<button class="voltar" onclick="devTemas=false;telaHoje()">‹ Voltar</button><div class="grupo-tit">Todos os temas</div><div class="temas">` +
      dev.map((d, i) => `<button onclick="devTemas=false;devUnico=${i};telaHoje();scrollTo(0,0)">${esc(d.tema)} <small>${(E.devLidos || {})[i] ? '✓' : ''}</small></button>`).join('') + '</div><div style="height:20px"></div>';
    return;
  }
  if (devUnico !== null) {
    el.innerHTML = `<button class="voltar" onclick="devUnico=null;telaHoje()">‹ Devocional de hoje</button><div class="dev-data">Tema ${devUnico + 1} de ${n}</div>` + blocoTema(dev[devUnico], devUnico, txt) +
      `<div class="nav-cap"><button onclick="devUnico=(devUnico+${n - 1})%${n};telaHoje();scrollTo(0,0)">‹ Anterior</button><button onclick="devUnico=(devUnico+1)%${n};telaHoje();scrollTo(0,0)">Próximo ›</button></div>`;
    el.querySelectorAll('textarea[data-i]').forEach(crescer);
    return;
  }
  const k = E.devPorDia || 2;
  const dia = new Date(hojeZero()); dia.setDate(dia.getDate() + devOff);
  const dias = Math.round((dia - INICIO_DEV) / 864e5), ini = (((dias * k) % n) + n) % n;
  let h = `<div class="cfg" style="border:0;padding:14px 0 0"><span style="color:var(--tx2);font-size:14px">Devocionais por dia</span><div class="seg">${[1, 2, 3, 4, 5].map(x => `<button class="${x === k ? 'on' : ''}" onclick="E.devPorDia=${x};salvar();telaHoje()">${x}</button>`).join('')}</div></div>
    <div class="dev-data">${devOff === 0 ? 'Hoje, ' : ''}${dia.toLocaleDateString('pt-BR', {weekday: 'long', day: 'numeric', month: 'long'})}</div>`;
  for (let x = 0; x < k; x++) { const i = (ini + x) % n; h += blocoTema(dev[i], i, txt, k > 1 ? `${x + 1}º devocional` : ''); }
  h += `<div class="nav-cap"><button onclick="devOff--;telaHoje();scrollTo(0,0)">‹ Dia anterior</button>${devOff ? `<button onclick="devOff=0;telaHoje();scrollTo(0,0)">Hoje</button>` : ''}<button onclick="devOff++;telaHoje();scrollTo(0,0)">Próximo dia ›</button></div>
    <div style="text-align:center;margin-bottom:24px"><button class="btn2" onclick="devTemas=true;telaHoje();scrollTo(0,0)">Ver todos os ${n} temas</button></div>
    <div class="info" style="text-align:center;margin-bottom:24px">${TRAD[E.trad].nome}</div>`;
  el.innerHTML = h;
  el.querySelectorAll('textarea[data-i]').forEach(crescer);
}
$('#t-hoje').addEventListener('click', e => {
  const v = e.target.closest('.dv'); if (!v || window.getSelection().toString()) return;
  abrirFolha(v.dataset.l, +v.dataset.c, +v.dataset.v);
  v.classList.add('sel');
});
// resumo: salva enquanto escreve
$('#t-hoje').addEventListener('input', e => {
  const ta = e.target.closest('textarea[data-i]'); if (!ta) return;
  const i = ta.dataset.i; E.resumos = E.resumos || {};
  if (ta.value.trim()) E.resumos[i] = {tx: ta.value, em: Date.now()}; else delete E.resumos[i];
  salvar(); crescer(ta); const s = $('#rs' + i); if (s) s.textContent = ta.value.trim() ? 'salvo' : '';
});
function crescer(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; }
function marcarDev(i) { E.devLidos = E.devLidos || {}; if (E.devLidos[i]) delete E.devLidos[i]; else E.devLidos[i] = Date.now(); salvar(); const y = scrollY; telaHoje().then(() => scrollTo(0, y)); }

// ---------- sobre e ajustes ----------
function telaSobre() {
  $('#t-sobre').innerHTML = `<div class="doc">
  <h2>Ajustes</h2>
  <div class="cfg"><span>Tamanho da letra</span><div class="seg"><button onclick="letra(-1)">A−</button><button class="on" style="min-width:44px">${E.fs}</button><button onclick="letra(1)">A+</button></div></div>
  <div class="cfg"><span>Aparência</span><div class="seg" id="segTema">${[['', 'Auto'], ['light', 'Clara'], ['sepia', 'Sépia'], ['dark', 'Escura']].map(([v, n]) => `<button class="${E.tema === v ? 'on' : ''}" onclick="E.tema='${v}';salvar();aplicarTema();telaSobre()">${n}</button>`).join('')}</div></div>

  <h2>Por que esta Bíblia</h2>
  <p>Você pediu uma Bíblia honesta, sem manipulação. Nenhuma tradução é perfeita — toda tradução faz escolhas. O jeito mais seguro de não ser conduzido por ninguém é ter <b>como conferir</b>. Por isso este app traz:</p>
  <div class="caixa"><p><b>1. Duas traduções independentes</b>, feitas por grupos diferentes, que não pertencem a nenhuma igreja ou organização religiosa e são de uso livre (ninguém é dono do texto).</p></div>
  <div class="caixa"><p><b>2. Comparar</b> — no topo da leitura, toque em <b>Comparar</b> para ver as duas lado a lado, versículo por versículo. Onde elas concordam, você pode ter confiança no sentido. Onde diferem, vale olhar o original.</p></div>
  <div class="caixa"><p><b>3. Original</b> — toque num versículo e em <b>🔤 Original</b> para ver cada palavra em hebraico (Antigo Testamento) ou grego (Novo Testamento), com a tradução palavra por palavra. Essa página é em inglês (site BibleHub) e precisa de internet.</p></div>
  <div class="caixa"><p><b>4. Palavras acrescentadas à vista</b> — na Bíblia Livre, as palavras que não existem no original e foram colocadas só para o português fazer sentido aparecem <span style="font-style:italic;color:var(--add)">em itálico cinza</span>. Assim você sabe o que é texto e o que é ajuda do tradutor.</p></div>
  <p>E a regra de ouro, que vale para qualquer Bíblia: <b>leia o capítulo inteiro</b>, não só um versículo solto. O contexto protege contra interpretações forçadas.</p>

  <h2>Os 66 livros</h2>
  <p>Este app traz só os <b>66 livros</b>: os 39 do Antigo Testamento, que são exatamente os livros da Bíblia hebraica dos judeus, e os 27 do Novo Testamento. As Bíblias católicas têm também os chamados livros <b>deuterocanônicos</b> (Tobias, Judite, Sabedoria, Eclesiástico, Baruc, 1 e 2 Macabeus e acréscimos em Ester e Daniel). Eles ficaram de fora porque não fazem parte da Bíblia hebraica dos judeus; chegaram até nós principalmente pela tradução grega antiga (a Septuaginta).</p>

  <h2>As traduções</h2>
  <h3>Bíblia Livre (BL)</h3>
  <p>Atualização para o português do Brasil da tradução de <b>João Ferreira de Almeida</b> (edição de 1819), a mais antiga e tradicional Bíblia em português, usada há séculos. Traduzida do hebraico e do grego (Texto Massorético e <i>Textus Receptus</i>). Linguagem mais clássica. Onde o original traz o nome de Deus (as letras hebraicas YHWH), ela usa “SENHOR” e, em alguns lugares, “EU-SOU”.</p>
  <p><small>Bíblia Livre (BLIVRE), Copyright © Diego Santos, Mario Sérgio e Marco Teles, versão de fevereiro de 2018. Licença Creative Commons Atribuição 4.0 Brasil. Texto obtido em eBible.org e reproduzido sem alterações.</small></p>
  <h3>Bíblia Portuguesa Mundial (BPM)</h3>
  <p>Tradução moderna e de linguagem mais simples, baseada na <i>World English Bible</i>, que por sua vez foi feita a partir do hebraico e do grego. Usa “SENHOR” para o nome de Deus. Ainda está em revisão pelos tradutores.</p>
  <p><small>Bíblia Portuguesa Mundial — domínio público. Texto obtido em eBible.org (versão de 08/10/2026) e reproduzido sem alterações.</small></p>

  <h2>Sobre o nome de Deus</h2>
  <p>No Antigo Testamento hebraico, o nome de Deus aparece cerca de 7 mil vezes escrito com quatro letras: <b>YHWH</b>. A pronúncia exata se perdeu, porque por respeito os judeus deixaram de pronunciá-lo em voz alta e liam “Adonai” (Senhor). Por isso a maioria das Bíblias escreve <b>SENHOR</b> em letras maiúsculas — isso indica que ali, no original, está o nome. Outras traduções escrevem “Javé”, “Iavé” ou “Jeová”. São escolhas de tradução; o texto original é o mesmo. Quando quiser ver exatamente o que está escrito, use o botão <b>🔤 Original</b>.</p>

  <h2>Como funciona o app</h2>
  <p>• Funciona <b>sem internet</b> depois de aberto a primeira vez.<br>• Deslize o dedo para o lado para mudar de capítulo.<br>• Toque num versículo para destacar, favoritar, anotar, copiar ou enviar.<br>• Para <b>grifar só algumas palavras</b>, segure o dedo sobre a palavra, arraste para escolher o trecho e toque numa cor na barra que aparece embaixo (✕ apaga o grifo).<br>• Na busca, digite uma palavra (“misericórdia”) ou vá direto a um texto (“Jo 3:16”, “salmos 23”).<br>• Em <b>Hoje</b>, os temas do dia (você escolhe quantos por dia, de 1 a 5; são 64 temas e depois recomeça), só com textos da Bíblia, sem comentários de ninguém. Embaixo de cada tema há o espaço <b>✍️ Meu resumo</b> para você escrever com suas palavras; ele salva sozinho. O número no fim de cada texto abre o capítulo inteiro.<br>• Suas notas ficam só neste celular — ninguém mais vê.</p>
  <p><small>Feito para Marcus do Vale.</small></p>
  </div>`;
}
function letra(d) { E.fs = Math.min(30, Math.max(14, E.fs + d)); salvar(); aplicarTema(); telaSobre(); }

// ---------- início ----------
document.addEventListener('keydown', e => { if (telaAtual !== 'ler' || e.target.matches('input,textarea')) return; if (e.key === 'ArrowRight') mudar(1); if (e.key === 'ArrowLeft') mudar(-1); if (e.key === 'Escape') fecharFolha(); });
(async () => {
  try { await Promise.all([contarCaps('blivre'), contarCaps('bpm')]); } catch (e) {}
  if (!LIV[E.livro]) E.livro = 'JOH';
  ler();
  // primeira vez que abre no dia: mostra o devocional
  const dia = hojeZero().toDateString();
  if (E.devVisto !== dia) { E.devVisto = dia; salvar(); irPara('hoje'); }
})();
if ('serviceWorker' in navigator) { let rec = !navigator.serviceWorker.controller; /* só recarrega quando é atualização, não na 1ª instalação */ navigator.serviceWorker.addEventListener('controllerchange', () => { if (rec) return; rec = true; location.reload(); }); addEventListener('load', () => navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(r => r.update()).catch(() => {})); }
</script>
